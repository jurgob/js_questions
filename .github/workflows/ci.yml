name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci fails on this old lockfile (bundled fsevents), so use npm install.
      - run: npm install --no-audit --no-fund

      - if: matrix.check == 'lint'
        run: npm run lint

      - if: matrix.check == 'test'
        run: npm test
        env:
          CI: true

      - if: matrix.check == 'build'
        run: npm run build
